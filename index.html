<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport"  content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <link rel="icon" type="image/png" href="/icons/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- OpenGraph Meta Data -->
    <meta property="og:title" content="{{APP_NAME}}">
    <meta property="og:description" content="{{TAGLINE}}">
    <meta property="og:image" content="/icons/icon.png">
    <meta property="og:url" content="https://{{COMPANY_WEBSITE}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{APP_NAME}}">
    
    <!-- Twitter Card Meta Data -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{APP_NAME}}">
    <meta name="twitter:description" content="{{TAGLINE}}">
    <meta name="twitter:image" content="/icons/icon.png">

    <!-- Analytics -->
    <script defer src="https://aob.bixbyapps.com/script.js" data-website-id="9511eefa-861a-48de-a78d-3c626781c099" data-domains="favs.bixbyapps.com"></script>

    <!-- dottie-analytics — parallel with Umami during migration -->
    <script defer src="https://api.dottie.ai/script.js" data-website-id="ad9b2b5e8bb86d34129ae24d0e711980" data-domains="favs.bixbyapps.com"></script>
    <!-- Prevent dark mode flash. Classic script so CSP script-src 'self' allows it. -->
    <script src="/theme-init.js"></script>

    <style>
      body { background: oklch(0.985 0 0); }
      .dark body { background: oklch(0.05 0 0); }
      #root { opacity: 0; }
    </style>

    <script defer type="module" src="/src/main.tsx"></script>
  </head>
  <body style="height: 100%; overscroll-behavior: none;">
    <div id="root"></div>
  </body>
</html>
